name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl git
              curl -fsSL https://get.docker.com | sudo sh
            fi

            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git
            fi

            APP_DIR="/home/azureuser/CommentsSPATask"
            REPO_URL="${{ vars.REPOSITORY_URL }}"

            if [ -z "$REPO_URL" ]; then
              echo "REPOSITORY_URL GitHub variable is required."
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cat > .env <<'ENVEOF'
            SA_PASSWORD=${{ secrets.SA_PASSWORD }}
            VM_PUBLIC_IP=${{ secrets.VM_HOST }}
            ENVEOF

            sudo docker compose -f compose.yaml -f compose.deploy.yaml up --build -d
            sudo docker image prune -f
