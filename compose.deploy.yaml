services:
  commentsspatask.client:
    build:
      args:
        VITE_BASE_URL: http://${VM_PUBLIC_IP}:8081/
        VITE_APP_COMMENTS_ENDPOINT: api/comments/
        VITE_APP_CAPTCHAS_ENDPOINT: api/captchas/
        VITE_APP_UPLOADS_ENDPOINT: uploads/
        VITE_APP_HUB_ENDPOINT: hubs/comments
    ports:
      - "8080:80"

  commentsspatask.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Cors__AllowedOrigins__0: http://${VM_PUBLIC_IP}:8080
      Swagger__Enabled: ${SWAGGER_ENABLED}
    ports:
      - "8081:8080"
