services:
  commentsspatask.client:
    image: commentsspatask.client
    build:
      context: .
      dockerfile: CommentsSPATask.Client/Dockerfile
      args:
        VITE_BASE_URL: http://localhost:8081/
        VITE_APP_COMMENTS_ENDPOINT: api/comments/
        VITE_APP_CAPTCHAS_ENDPOINT: api/captchas/
        VITE_APP_UPLOADS_ENDPOINT: uploads/
        VITE_APP_HUB_ENDPOINT: hubs/comments

  commentsspatask.api:
    image: commentsspatask.api
    build:
      context: .
      dockerfile: CommentsSPATask.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CommentsSPATask;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
